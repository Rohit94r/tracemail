[project]
name = "securemailscope-backend"
version = "1.4.0"
description = "Passive Cryptographic Security Posture Assessment of Email Infrastructure"
authors = [{ name = "Raven Team (SIH26159)" }]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "scapy>=2.6.0",
    "cryptography>=43.0.0",
    "pydantic>=2.8.0",
    "pymongo>=4.8.0",
    "dnspython>=2.6.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
pythonpath = [".."]

