<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad-3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09121d"/>
      <stop offset="100%" stop-color="#0f1f2e"/>
    </linearGradient>
    <pattern id="grid-pattern-3" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.4"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg-grad-3)"/>
  <rect width="800" height="500" fill="url(#grid-pattern-3)"/>

  <!-- Radial Glow Behind Card -->
  <circle cx="400" cy="220" r="200" fill="#10b981" opacity="0.08" filter="blur(50px)"/>
  <circle cx="650" cy="350" r="160" fill="#44d5cc" opacity="0.07" filter="blur(50px)"/>

  <!-- Card Frame -->
  <g transform="translate(60, 45)">
    <!-- Header Terminal Bar -->
    <rect width="680" height="410" rx="16" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <rect width="680" height="42" rx="16" fill="#1e293b"/>
    <rect y="26" width="680" height="16" fill="#1e293b"/>
    
    <!-- Window controls -->
    <circle cx="24" cy="21" r="5" fill="#ef4444"/>
    <circle cx="42" cy="21" r="5" fill="#f59e0b"/>
    <circle cx="60" cy="21" r="5" fill="#10b981"/>
    
    <text x="340" y="26" fill="#94a3b8" font-family="monospace" font-size="12" text-anchor="middle" font-weight="600">RFC_8461_MTA_STS // RFC_7672_DANE_ENFORCEMENT</text>
    <rect x="545" y="12" width="115" height="18" rx="9" fill="#10b981" fill-opacity="0.2"/>
    <text x="602" y="25" fill="#34d399" font-family="sans-serif" font-size="10" font-weight="700" text-anchor="middle">STRICT PINNING</text>

    <!-- Content Sections -->
    <g transform="translate(25, 60)">
      <!-- Top Box: MTA-STS Policy Record -->
      <g transform="translate(0, 0)">
        <rect width="630" height="100" rx="10" fill="#0b0f19" stroke="#1e293b" stroke-width="1"/>
        <circle cx="25" cy="25" r="5" fill="#44d5cc"/>
        <text x="40" y="28" fill="#44d5cc" font-family="sans-serif" font-size="11" font-weight="700">MTA-STS POLICY RECORD (RFC 8461)</text>
        <rect x="535" y="15" width="80" height="20" rx="4" fill="#10b981" fill-opacity="0.2"/>
        <text x="575" y="29" fill="#10b981" font-family="monospace" font-size="10" font-weight="700" text-anchor="middle">HTTPS 443</text>

        <rect x="20" y="42" width="590" height="44" rx="6" fill="#1e293b" fill-opacity="0.7"/>
        <text x="35" y="62" fill="#e2e8f0" font-family="monospace" font-size="11">version: STSv1 | mode: <tspan fill="#34d399" font-weight="bold">enforce</tspan> | mx: *.secure.corp.net | max_age: 604800s</text>
        <text x="35" y="77" fill="#94a3b8" font-family="sans-serif" font-size="10">Guarantees mandatory TLS 1.3 handshake; aborts delivery on unauthenticated cleartext fallback.</text>
      </g>

      <!-- Middle Comparison: SPF/DKIM/DMARC vs MTA-STS/DANE -->
      <g transform="translate(0, 115)">
        <!-- Left: What DMARC Covers -->
        <g transform="translate(0, 0)">
          <rect width="305" height="135" rx="10" fill="#0b0f19" stroke="#1e293b" stroke-width="1"/>
          <text x="20" y="26" fill="#94a3b8" font-family="sans-serif" font-size="10" font-weight="700">IDENTITY DEFENSE (AT REST)</text>
          
          <g transform="translate(20, 38)">
            <rect width="265" height="26" rx="4" fill="#1e293b"/>
            <text x="10" y="17" fill="#cbd5e1" font-family="monospace" font-size="10">SPF: Sender IP Authorisation</text>
            <text x="245" y="17" fill="#10b981" font-family="sans-serif" font-size="11" font-weight="bold">✓</text>
          </g>
          <g transform="translate(20, 70)">
            <rect width="265" height="26" rx="4" fill="#1e293b"/>
            <text x="10" y="17" fill="#cbd5e1" font-family="monospace" font-size="10">DKIM: Body Digest Signature</text>
            <text x="245" y="17" fill="#10b981" font-family="sans-serif" font-size="11" font-weight="bold">✓</text>
          </g>
          <g transform="translate(20, 102)">
            <rect width="265" height="26" rx="4" fill="#450a0a" stroke="#ef4444" stroke-opacity="0.3"/>
            <text x="10" y="17" fill="#fca5a5" font-family="monospace" font-size="10">Transit Confidentiality: NONE</text>
            <text x="245" y="17" fill="#ef4444" font-family="sans-serif" font-size="11" font-weight="bold">✕</text>
          </g>
        </g>

        <!-- Right: What Raven Audits (In Transit) -->
        <g transform="translate(325, 0)">
          <rect width="305" height="135" rx="10" fill="#0b0f19" stroke="#10b981" stroke-width="1.2"/>
          <text x="20" y="26" fill="#34d399" font-family="sans-serif" font-size="10" font-weight="700">CRYPTOGRAPHIC PINNING (IN TRANSIT)</text>
          
          <g transform="translate(20, 38)">
            <rect width="265" height="26" rx="4" fill="#064e3b" fill-opacity="0.5"/>
            <text x="10" y="17" fill="#a7f3d0" font-family="monospace" font-size="10">DANE TLSA (DNSSEC Pinning)</text>
            <text x="245" y="17" fill="#34d399" font-family="sans-serif" font-size="11" font-weight="bold">✓</text>
          </g>
          <g transform="translate(20, 70)">
            <rect width="265" height="26" rx="4" fill="#064e3b" fill-opacity="0.5"/>
            <text x="10" y="17" fill="#a7f3d0" font-family="monospace" font-size="10">MTA-STS Strict Enforce Mode</text>
            <text x="245" y="17" fill="#34d399" font-family="sans-serif" font-size="11" font-weight="bold">✓</text>
          </g>
          <g transform="translate(20, 102)">
            <rect width="265" height="26" rx="4" fill="#064e3b" fill-opacity="0.5"/>
            <text x="10" y="17" fill="#a7f3d0" font-family="monospace" font-size="10">Anti-Stripping Cryptographic Lock</text>
            <text x="245" y="17" fill="#34d399" font-family="sans-serif" font-size="11" font-weight="bold">✓</text>
          </g>
        </g>
      </g>

      <!-- Bottom Status Banner -->
      <g transform="translate(0, 265)">
        <rect width="630" height="60" rx="8" fill="#1e293b" fill-opacity="0.7" stroke="#334155" stroke-width="1"/>
        <circle cx="25" cy="30" r="8" fill="#10b981"/>
        <text x="45" y="27" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="700">SECUREMAILSCOPE AUDIT RESULT: ZERO DOWNGRADE EXPOSURE</text>
        <text x="45" y="47" fill="#94a3b8" font-family="monospace" font-size="10">Verified DANE TLSA Hash: 3 1 1 e3b0c442... // RFC 8461 Policy: Valid (Max Age 7d)</text>
      </g>
    </g>
  </g>
</svg>
